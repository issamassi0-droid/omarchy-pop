# kitty.conf
# Omarchy Theme - Modified Pop

# Color scheme
background #30302f
foreground #d1ccc3
selection_background #909080
selection_foreground #d1ccc3

# Black
color0 #30302f
color8 #686860

# Red
color1 #686860
color9 #909080

# Green
color2 #909080
color10 #d1ccc3

# Yellow
color3 #505048
color11 #505048

# Blue
color4 #d1ccc3
color12 #909080

# Magenta
color5 #909080
color13 #d1ccc3

# Cyan
color6 #505048
color14 #686860

# White
color7 #d1ccc3
color15 #d1ccc3

# Cursor colors
cursor #d2cbbd
cursor_text_color #30302f

# Border settings (1px with 0.6 alpha - approximated)
window_border_width 1
window_border_color rgba(210,203,189,0.6)
active_window_border_color rgba(210,203,189,0.8)
inactive_window_border_color rgba(210,203,189,0.3)

# Window appearance
background_opacity 0.95
dynamic_background_opacity yes
background_tint 0.0

# Font settings
font_family JetBrainsMono Nerd Font
font_size 14.0
bold_font auto
italic_font auto
bold_italic_font auto

# Padding
window_padding_width 10
