# ghostty.conf
# Omarchy Theme - Modified Pop

# Color Palette
# Background
background = #30302f
foreground = #d1ccc3

# Black
palette = 0=#30302f
palette = 8=#686860

# Red
palette = 1=#686860
palette = 9=#909080

# Green
palette = 2=#909080
palette = 10=#d1ccc3

# Yellow
palette = 3=#505048
palette = 11=#505048

# Blue
palette = 4=#d1ccc3
palette = 12=#909080

# Magenta
palette = 5=#909080
palette = 13=#d1ccc3

# Cyan
palette = 6=#505048
palette = 14=#686860

# White
palette = 7=#d1ccc3
palette = 15=#d1ccc3

# Cursor
cursor-color = #d2cbbd
cursor-text = #30302f

# Selection
selection-background = #909080
selection-foreground = #d1ccc3

# Window Settings
window-padding-x = 10
window-padding-y = 10
window-theme = dark
window-blur = true
window-blur-radius = 10
window-opacity = 0.95

# Font Settings
font-family = JetBrainsMono Nerd Font
font-size = 12
font-style = normal
font-weight = 400
font-features = ss01, ss02, ss03, ss04, ss05, ss06

# Terminal Behavior
shell-integration = auto
shell-integration-features = cursor, prompt, sudo, title
copy-on-select = false
paste-protection = true
mouse-shift-capture = true
cursor-style = block
cursor-style-blink = false

# Scrollback
scrollback-limit = 10000
scrollback-lines = 10000

# Bell
bell = false
bell-volume = 0.5
visual-bell = false

# Keyboard
keybind = ctrl+shift+c=copy_to_clipboard
keybind = ctrl+shift+v=paste_from_clipboard
keybind = ctrl+shift+f=search
keybind = ctrl+shift+minus=decrease_font_size
keybind = ctrl+shift+equal=increase_font_size
keybind = ctrl+shift+0=reset_font_size

# Misc
bold-is-bright = true
mouse-hide-while-typing = true
quick-terminal = false
confirm-close-surface = false