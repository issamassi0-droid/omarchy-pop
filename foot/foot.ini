# foot.ini
# Omarchy Theme - Modified Pop

[main]
# Font configuration
font=JetBrainsMono Nerd Font:size=12
font-bold=JetBrainsMono Nerd Font:bold:size=12
font-italic=JetBrainsMono Nerd Font:italic:size=12
font-bold-italic=JetBrainsMono Nerd Font:bold:italic:size=12
line-height=1.2
letter-spacing=0

# DPI scaling
dpi-aware=yes

# Colors
[colors]
# Background and foreground
background=484543
foreground=d1ccc3

# Regular colors (0-7)
regular0=484543  # black
regular1=686860  # red
regular2=909080  # green
regular3=505048  # yellow
regular4=d1ccc3  # blue
regular5=909080  # magenta
regular6=505048  # cyan
regular7=d1ccc3  # white

# Bright colors (8-15)
bright0=686860   # bright black
bright1=909080   # bright red
bright2=d1ccc3   # bright green
bright3=505048   # bright yellow
bright4=909080   # bright blue
bright5=d1ccc3   # bright magenta
bright6=686860   # bright cyan
bright7=d1ccc3   # bright white

# Cursor colors
cursor-color=d2cbbd
cursor-text-color=484543

# Selection colors
selection-background=909080
selection-foreground=d1ccc3

# Search colors
search-box-no-match=ff0000
search-box-match=00ff00

# URL colors
url-color=d2cbbd
url-underline=d2cbbd

# Jump label colors
jump-label=484543
jump-label-leader=505048

# Mouse
[mouse]
hide-when-typing=yes

# Cursor
[cursor]
style=block
blink=no
beam-thickness=2

# Terminal behavior
[terminal]
shell=/bin/bash
term=foot-256color
login-shell=no
word-delimiters=,│`|:"'()[]{}<>
selection-target=primary

# Scrollback
[scrollback]
lines=10000
multiplier=3.0
indicator-style=block
indicator-color=d2cbbd
indicator-position=relative

# URL detection
[url]
launch=xdg-open
label-letters=sadfjklewcmpgh
osc8-underline=url-mode
osc8-underline-color=d2cbbd
protocols=http,https,ftp,ftps,file,gopher,gemini,mailto,news,git,ssh,telnet

# Window appearance
[window]
size=800x500
padding=10x10
background-opacity=0.95
# For Wayland
app-id=foot
title=Foot
class=foot
title-stack=yes
# For X11
fullscreen=no
maximized=no
decorations=server
# Use this for custom decorations with 1px border
# csd=no
# border-width=1
# border-color=d2cbbd

# CSD (Client-Side Decorations) for 1px border with 0.6 alpha
[csd]
# Title bar
title-font=JetBrainsMono Nerd Font:size=12
title-color=d1ccc3
title-background-color=484543
# Borders (1px with 0.6 alpha)
border-width=1
border-color=d2cbbd
button-style=icon
button-color=d1ccc3
button-background-color=484543
button-hover-background-color=505048
button-pressed-background-color=686860
button-close-color=d1ccc3
button-close-background-color=484543
button-close-hover-background-color=686860
button-close-pressed-background-color=686860
# Double-click action
double-click=titlebar-maximize
# Mouse actions
mouse-bindings=titlebar-left-click=maximize, titlebar-right-click=menu, titlebar-middle-click=none

# Key bindings
[key-bindings]
# Standard
search=Control+Shift+f
copy=Control+Shift+c
paste=Control+Shift+v
increase-font-size=Control+plus Control+equal
decrease-font-size=Control+minus
reset-font-size=Control+0
toggle-fullscreen=Control+Shift+Return
spawn-terminal=Control+Shift+n
quit=Control+Shift+q
scrollback-up-page=Shift+Page_Up
scrollback-down-page=Shift+Page_Down
scrollback-up-half-page=none
scrollback-down-half-page=none
scrollback-up-line=Shift+Up
scrollback-down-line=Shift+Down
# Clipboard
copy-primary=Control+Shift+space
paste-primary=Control+Shift+v
# URL mode
show-urls-launch=Control+Shift+u
show-urls-copy=Control+Shift+u
# Jump mode
jump-label=Control+Shift+j
# Pipe
pipe-scrollback=none
pipe-visible=none
pipe-selected=none
# Other
show-bold=Control+Shift+b
unicode-input=Control+Shift+i
# Font size shortcuts
font-size-up=Control+plus Control+equal
font-size-down=Control+minus
font-size-reset=Control+0

# Context menu (right-click)
[context-menu]
# Comment/uncomment to enable/disable
# actions=copy,paste,search,font-size-up,font-size-down,font-size-reset